name: ElectraTech CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint & Validate Frontend (Next.js)
  # ----------------------------------------------------------------------------
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electratech-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electratech-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  # ----------------------------------------------------------------------------
  # Job 2: Build & Test Backend (Node.js & Database Check)
  # ----------------------------------------------------------------------------
  test-backend:
    name: Test & Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electratech-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: electratech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electratech-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate database migrations
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/electratech_test
          MQTT_ENABLED: 'false'
        run: |
          node scripts/migrate.js

  # ----------------------------------------------------------------------------
  # Job 3: Build & Validate Docker Containers
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy environment template for Docker Compose
        run: |
          cp .env.example .env

      - name: Validate Docker Compose configuration
        run: |
          docker compose config

      - name: Build Docker images
        run: |
          docker compose build --parallel

  # ----------------------------------------------------------------------------
  # Job 4: Deploy Stage (Production / Server via SSH or Webhook)
  # Triggered only on push to main/master branch
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy step confirmation
        run: |
          echo "Semua tahap CI (Lint, Test DB, Docker Build) telah berhasil."
          echo "Siap untuk auto-deploy ke server (VPS / Cloud Provider)."

